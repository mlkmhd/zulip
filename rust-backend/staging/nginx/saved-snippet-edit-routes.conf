# Include in staging app.d. The map selects the enabled snippet detail methods.
location ~ ^/api/v1/saved_snippets/[0-9]+$ {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_saved_snippet_edit;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_saved_snippet_edit) {
        return 418;
    }
    include /etc/nginx/zulip-include/api_headers;
    include uwsgi_params;
}

location @zulip_rust_saved_snippet_edit {
    error_page 502 503 504 /api_5xx.json;
    include /etc/nginx/zulip-include/api_headers;
    include /etc/nginx/zulip-include/proxy;
    proxy_pass http://127.0.0.1:9997;
}
