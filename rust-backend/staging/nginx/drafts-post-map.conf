# Use in place of drafts-delete-map.conf to enable POST for the same realm.
map "$request_method $http_host $request_uri" $zulip_rust_drafts {
    default 0;
    "~^(GET|HEAD|POST) (?i:zulip\.testserver)(:8880)? (/api/v1|/json)/drafts(\?|$)" 1;
    "~^DELETE (?i:zulip\.testserver)(:8880)? (/api/v1|/json)/drafts/[0-9]+(\?|$)" 1;
}
