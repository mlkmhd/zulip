# May be installed before opting in to Rust routing.
location = /health/rust-alert-words {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    error_page 502 504 /api_5xx.json;
    include /etc/nginx/zulip-include/proxy;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_intercept_errors off;
    proxy_pass http://127.0.0.1:9997;
}
