# Include in the staging app.d directory to opt in. A named error_page
# transfers the original method and URI to Rust, including for HEAD.
# Allow the named location to use the existing API error page on failure.
location = /api/v1/users/me/alert_words {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_alert_words_api;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_alert_words_read) {
        return 418;
    }
    include /etc/nginx/zulip-include/api_headers;
    include uwsgi_params;
}

location = /json/users/me/alert_words {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_alert_words_json;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_alert_words_read) {
        return 418;
    }
    include uwsgi_params;
}

location @zulip_rust_alert_words_api {
    error_page 502 503 504 /api_5xx.json;
    include /etc/nginx/zulip-include/api_headers;
    include /etc/nginx/zulip-include/proxy;
    proxy_pass http://127.0.0.1:9997;
}

location @zulip_rust_alert_words_json {
    error_page 502 503 504 /api_5xx.json;
    include /etc/nginx/zulip-include/proxy;
    proxy_pass http://127.0.0.1:9997;
}
