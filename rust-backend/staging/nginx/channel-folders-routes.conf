# Include in the staging app.d directory along with channel-folders-map.conf.
location = /api/v1/channel_folders {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_channel_folders_api;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_channel_folders) {
        return 418;
    }
    include /etc/nginx/zulip-include/api_headers;
    include uwsgi_params;
}

location = /json/channel_folders {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_channel_folders_web;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_channel_folders) {
        return 418;
    }
    include uwsgi_params;
}

location @zulip_rust_channel_folders_api {
    error_page 502 503 504 /api_5xx.json;
    include /etc/nginx/zulip-include/api_headers;
    include /etc/nginx/zulip-include/proxy;
    proxy_pass http://127.0.0.1:9997;
}

location @zulip_rust_channel_folders_web {
    error_page 502 503 504 /api_5xx.json;
    include /etc/nginx/zulip-include/proxy;
    proxy_pass http://127.0.0.1:9997;
}
