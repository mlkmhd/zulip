# Use in place of reminders-map.conf to enable DELETE for the same realm.
map "$request_method $http_host $request_uri" $zulip_rust_reminders {
    default 0;
    "~^(GET|HEAD) (?i:zulip\.testserver)(:8880)? (/api/v1|/json)/reminders(\?|$)" 1;
    "~^DELETE (?i:zulip\.testserver)(:8880)? (/api/v1|/json)/reminders/[0-9]+(\?|$)" 1;
}
