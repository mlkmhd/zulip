# Include in staging app.d to opt in to web reads independently of the API.
location = /json/saved_snippets {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_saved_snippets_web;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_saved_snippets_web_read) {
        return 418;
    }
    include uwsgi_params;
}

location @zulip_rust_saved_snippets_web {
    error_page 502 503 504 /api_5xx.json;
    include /etc/nginx/zulip-include/proxy;
    proxy_pass http://127.0.0.1:9997;
}
