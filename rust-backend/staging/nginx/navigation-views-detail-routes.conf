# Include with navigation-views-routes.conf and navigation-views-detail-map.conf.
location ~ ^/api/v1/navigation_views/.+$ {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_navigation_views_api;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_navigation_view_details) {
        return 418;
    }
    include /etc/nginx/zulip-include/api_headers;
    include uwsgi_params;
}

location ~ ^/json/navigation_views/.+$ {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_navigation_views_web;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_navigation_view_details) {
        return 418;
    }
    include uwsgi_params;
}
