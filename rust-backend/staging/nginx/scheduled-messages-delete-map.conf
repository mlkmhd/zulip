# Use in place of scheduled-messages-map.conf to enable DELETE for the same realm.
map "$request_method $http_host $request_uri" $zulip_rust_scheduled_messages {
    default 0;
    "~^(GET|HEAD) (?i:zulip\.testserver)(:8880)? (/api/v1|/json)/scheduled_messages(\?|$)" 1;
    "~^DELETE (?i:zulip\.testserver)(:8880)? (/api/v1|/json)/scheduled_messages/[0-9]+(\?|$)" 1;
}
