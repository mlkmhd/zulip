# Include in the http context. Match the original URI and an explicitly
# verified staging realm host. Replace the host and optional port together.
map "$request_method $http_host $request_uri" $zulip_rust_alert_words_read {
    default 0;
    "~^(GET|HEAD) (?i:zulip\.testserver)(:8880)? (/api/v1|/json)/users/me/alert_words(\?|$)" 1;
}
