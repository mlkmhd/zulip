# Include in the staging app.d directory along with realm-emoji-map.conf.
location = /api/v1/realm/emoji {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_realm_emoji_api;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_realm_emoji) {
        return 418;
    }
    include /etc/nginx/zulip-include/api_headers;
    include uwsgi_params;
}

location = /json/realm/emoji {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_realm_emoji_web;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_realm_emoji) {
        return 418;
    }
    include uwsgi_params;
}

location @zulip_rust_realm_emoji_api {
    error_page 502 503 504 /api_5xx.json;
    include /etc/nginx/zulip-include/api_headers;
    include /etc/nginx/zulip-include/proxy;
    proxy_pass http://127.0.0.1:9997;
}

location @zulip_rust_realm_emoji_web {
    error_page 502 503 504 /api_5xx.json;
    include /etc/nginx/zulip-include/proxy;
    proxy_pass http://127.0.0.1:9997;
}
