# Use in place of saved-snippets-web-map.conf after validating web POST.
# Include in the http context. Replace the verified realm host and port together.
map "$request_method $http_host $request_uri" $zulip_rust_saved_snippets_web_read {
    default 0;
    "~^(GET|HEAD|POST) (?i:zulip\.testserver)(:8880)? /json/saved_snippets(\?|$)" 1;
}
