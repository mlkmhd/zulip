[package]
name = "zulip-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
name = "_zulip_backend"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]
http = ["dep:axum", "dep:base64", "dep:gettext", "dep:httpdate", "dep:regex", "dep:serde_json", "dep:tokio", "dep:tokio-postgres"]

[[bin]]
name = "zulip-http"
path = "src/bin/zulip-http.rs"
required-features = ["http"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"], optional = true }
base64 = { version = "0.22", optional = true }
gettext = { version = "0.4.0", optional = true }
httpdate = { version = "1.0", optional = true }
pyo3 = { version = "0.30.1", features = ["abi3-py310"], optional = true }
regex = { version = "1.12", optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.54", features = ["macros", "net", "rt"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
